# RCX Agent Review Workflow
#
# Automatically runs agent-based code review on PRs.
# Uses the Claude Agent SDK to run specialized review agents.
#
# Trigger: Manual dispatch + auto PR trigger on core paths
#
# Required secrets:
#   ANTHROPIC_API_KEY - API key for Claude Agent SDK

name: Agent Review

on:
  # Manual trigger with options
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: string
      depth:
        description: 'Review depth'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - quick
          - full
      post_comment:
        description: 'Post review comment to PR'
        required: false
        default: true
        type: boolean

  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'rcx_pi/**'
      - 'mu/**'
      - 'tools/run_review.py'
      - 'tools/run_ci_review.py'
      - 'tools/run_skeptic.py'
      - 'tools/shared_agent_utils.py'
      - 'tools/validate_agent_compliance.py'
      - 'tools/validate_agent_reasoning.py'
      - 'tools/agents/**'
      - 'docs/agents/**'

jobs:
  agent-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: agent-review-${{ github.event.pull_request.number || github.event.inputs.pr_number || github.ref }}
      cancel-in-progress: true

    steps:
      - name: Check preconditions (secrets/fork)
        id: preconditions
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]] && [[ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "reason=fork PR - secrets unavailable" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "${ANTHROPIC_API_KEY}" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "reason=missing ANTHROPIC_API_KEY secret" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        if: steps.preconditions.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for diff analysis

      - name: Set up Python
        if: steps.preconditions.outputs.enabled == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.preconditions.outputs.enabled == 'true'
        run: |
          pip install claude-agent-sdk
          pip install hypothesis pytest  # For fuzzer tests

      - name: Run CI Review
        if: steps.preconditions.outputs.enabled == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.inputs.pr_number || github.event.pull_request.number }}
        run: |
          python tools/run_ci_review.py \
            --pr-number $PR_NUMBER \
            ${{ github.event.inputs.post_comment == 'true' && '--post-comment' || '' }} \
            --output review-report.md

      - name: Upload review report
        if: steps.preconditions.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: agent-review-report
          path: review-report.md
          retention-days: 30

      - name: Comment on PR (if not using --post-comment)
        if: ${{ steps.preconditions.outputs.enabled == 'true' && github.event.inputs.post_comment != 'true' && github.event.pull_request.number }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('review-report.md', 'utf8');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: report
            });

      - name: Skip reason
        if: steps.preconditions.outputs.enabled != 'true'
        run: |
          echo "Skipping agent review: ${{ steps.preconditions.outputs.reason }}"
