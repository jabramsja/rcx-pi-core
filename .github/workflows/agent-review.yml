# RCX Agent Review Workflow
#
# Automatically runs agent-based code review on PRs.
# Uses the Claude Agent SDK to run specialized review agents.
#
# Trigger: Manual dispatch + auto PR trigger on core paths
#
# Required secrets:
#   ANTHROPIC_API_KEY - API key for Claude Agent SDK

name: Agent Review

on:
  # Manual trigger with options
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: string
      depth:
        description: 'Review depth'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - quick
          - full
      post_comment:
        description: 'Post review comment to PR'
        required: false
        default: true
        type: boolean

  # Auto-trigger disabled — agent review uses Anthropic API (pay-per-token),
  # not the Max subscription. Use manual workflow_dispatch when API cost is
  # justified, or run locally with: python tools/runners/run_review.py --pr
  #
  # pull_request:
  #   types: [opened, synchronize, reopened, ready_for_review]
  #   paths:
  #     - 'rcx_pi/**'
  #     - 'mu/**'
  #     - 'tools/runners/run_review.py'
  #     - 'tools/runners/run_ci_review.py'
  #     - 'tools/runners/run_skeptic.py'
  #     - 'tools/shared_agent_utils.py'
  #     - 'tools/validate_agent_compliance.py'
  #     - 'tools/validate_agent_reasoning.py'
  #     - 'tools/agents/**'
  #     - 'mu/docs/agents/**'

jobs:
  agent-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: agent-review-${{ github.event.pull_request.number || github.event.inputs.pr_number || github.ref }}
      cancel-in-progress: true

    steps:
      - name: Check preconditions (secrets/fork)
        id: preconditions
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]] && [[ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "reason=fork PR - secrets unavailable" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "${ANTHROPIC_API_KEY}" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "reason=missing ANTHROPIC_API_KEY secret" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        if: steps.preconditions.outputs.enabled == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0  # Full history for diff analysis

      - name: Set up Python
        if: steps.preconditions.outputs.enabled == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        if: steps.preconditions.outputs.enabled == 'true'
        run: |
          pip install anthropic
          pip install hypothesis pytest  # For fuzzer tests

      - name: Validate PR number
        if: steps.preconditions.outputs.enabled == 'true'
        env:
          PR_NUM: ${{ github.event.inputs.pr_number || github.event.pull_request.number }}
        run: |
          if ! [[ "$PR_NUM" =~ ^[0-9]+$ ]]; then
            echo "ERROR: PR number must be numeric, got: '$PR_NUM'" >&2
            exit 1
          fi

      - name: Run CI Review
        if: steps.preconditions.outputs.enabled == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.inputs.pr_number || github.event.pull_request.number }}
        run: |
          python tools/runners/run_ci_review.py \
            --pr-number $PR_NUMBER \
            ${{ github.event.inputs.post_comment == 'true' && '--post-comment' || '' }} \
            --output review-report.md \
            --full-output review-report-full.md \
            --json-output review-results.json

      - name: Upload review report
        if: steps.preconditions.outputs.enabled == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-review-report
          path: |
            review-report.md
            review-report-full.md
            review-results.json
          retention-days: 30

      - name: Comment on PR (if not using --post-comment)
        if: ${{ steps.preconditions.outputs.enabled == 'true' && github.event.inputs.post_comment != 'true' && github.event.pull_request.number }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('review-report.md', 'utf8');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: report
            });

      - name: Skip reason
        if: steps.preconditions.outputs.enabled != 'true'
        run: |
          echo "Skipping agent review: ${{ steps.preconditions.outputs.reason }}"
