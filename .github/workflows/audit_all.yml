name: Audit All

# Manual-only gate for deep validation (includes extra checks beyond green_gate)
# NOTE: green_gate.yml now includes anti-cheat scans and fixture validation
# This workflow adds: CLI exec-summary spot-check, repo clean verification
# Use this for comprehensive validation before important releases
on:
  workflow_dispatch:  # Manual trigger only - avoids duplicate runs with green_gate.yml

concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: "0"
      PYTHONPATH: "."
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install package + test deps
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -U pip
          python -m pip install -e ".[test]"

      - name: Run audit_all.sh
        shell: bash
        run: |
          set -euo pipefail
          tools/audit_all.sh
