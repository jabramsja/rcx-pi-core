name: CI

# Light gate - feature branch feedback only
# PRs to dev are handled by green_gate.yml (more comprehensive)
# Excludes dev branch to avoid duplicate runs (green_gate handles dev)
on:
  push:
    branches-ignore:
      - dev

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"  # Deterministic dict ordering
      RCX_CI: "1"  # Convert test skips to failures (skip hardening)
      HYPOTHESIS_PROFILE: "ci_fast"  # Fast feedback for feature branches
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"  # Cache pip dependencies

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install package + test deps
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -U pip
          python -m pip install -e ".[test]"

      - name: Doc consistency check
        shell: bash
        run: |
          set -euo pipefail
          tools/checks/check_docs_consistency.sh

      - name: Enforce tracker sync for core changes
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            # New branch — compare with parent
            RANGE="HEAD~1...HEAD"
            echo "Range: HEAD~1...HEAD (new branch)"
          elif git cat-file -e "$BEFORE" 2>/dev/null; then
            # Normal push — before SHA exists in history
            RANGE="${BEFORE}...${{ github.sha }}"
            echo "Range: ${BEFORE}...${{ github.sha }}"
          else
            # Force-push rewrote history — before SHA unreachable
            echo "FALLBACK: event.before ($BEFORE) unreachable after force-push, using origin/dev as base"
            git fetch origin dev --quiet
            RANGE="origin/dev...${{ github.sha }}"
            echo "Range: origin/dev...${{ github.sha }}"
          fi
          tools/checks/enforce_tracker_sync.sh --range "$RANGE"

      - name: Enforce L4 execution contract
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="HEAD~1...HEAD"
            echo "Range: HEAD~1...HEAD (new branch)"
          elif git cat-file -e "$BEFORE" 2>/dev/null; then
            RANGE="${BEFORE}...${{ github.sha }}"
            echo "Range: ${BEFORE}...${{ github.sha }}"
          else
            echo "FALLBACK: event.before ($BEFORE) unreachable after force-push, using origin/dev as base"
            git fetch origin dev --quiet
            RANGE="origin/dev...${{ github.sha }}"
            echo "Range: origin/dev...${{ github.sha }}"
          fi
          python tools/checks/enforce_l4_execution_contract.py --range "$RANGE"

      - name: Green gate (authoritative, python-only)
        shell: bash
        run: |
          set -euo pipefail
          # green_gate.sh already runs:
          # - goldens (via pytest)
          # - JS parity (eval_step.js + test_js_parity_automated.py)
          # - all other python tests
          # RCX_CI=1 ensures CLI failures fail tests instead of skipping
          scripts/green_gate.sh python-only

      - name: Branch coverage report (rcx_pi/selfhost/)
        shell: bash
        run: |
          set -euo pipefail
          # Report branch coverage for critical modules (not gating yet)
          python -m pytest tests/engine/test_spec_ground_truth.py \
            --cov=rcx_pi.selfhost \
            --cov-report=term-missing \
            --cov-branch \
            -q || true
          echo "Coverage report generated (not gating - informational only)"
