name: CI

# Light gate - feature branch feedback only
# PRs to dev are handled by green_gate.yml (more comprehensive)
# Excludes dev branch to avoid duplicate runs (green_gate handles dev)
on:
  push:
    branches-ignore:
      - dev

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"  # Deterministic dict ordering
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"  # Cache pip dependencies

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install package + test deps
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -U pip
          python -m pip install -e ".[test]"

      - name: Doc consistency check
        shell: bash
        run: |
          set -euo pipefail
          tools/check_docs_consistency.sh

      - name: Green gate (authoritative, python-only)
        shell: bash
        run: |
          set -euo pipefail
          # green_gate.sh already runs:
          # - goldens (via pytest)
          # - JS parity (eval_step.js + test_js_parity_automated.py)
          # - all other python tests
          scripts/green_gate.sh python-only
