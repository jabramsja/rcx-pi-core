name: rcx-green-gate

on:
  schedule:
    # Nightly GREEN gate on dev (14:00 UTC ≈ 9:00 AM Detroit)
    - cron: '0 14 * * *'
  workflow_dispatch:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

concurrency:
  group: rcx-green-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  green-gate:
    name: green-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: "0"  # Deterministic dict ordering
      RCX_CI: "1"  # Convert test skips to failures (skip hardening)
      # CI Split: full for nightly (~500 examples), fast for everything else (~50 examples)
      HYPOTHESIS_PROFILE: ${{ github.event_name == 'schedule' && 'ci_full' || 'ci_fast' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Note: Rust setup removed - rcx_pi_rust archived

      - name: Install system deps
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Install project (editable)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -U pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          python -m pip install -e ".[test]"

      - name: Doc consistency check
        shell: bash
        run: |
          set -euo pipefail
          tools/check_docs_consistency.sh

      - name: Enforce tracker sync for core changes
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}...${{ github.sha }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${{ github.event.before }}...${{ github.sha }}"
          else
            echo "Skipping tracker sync check for event: ${{ github.event_name }}"
            exit 0
          fi
          tools/enforce_tracker_sync.sh --range "$RANGE"

      - name: Run green gate
        shell: bash
        run: |
          set -euo pipefail
          export PAGER=cat GIT_PAGER=cat LESS='-FRSX'
          # Run python-only mode - Rust tests run via rust_examples.yml (manual)
          # Rust hasn't changed frequently; saves ~3-5 min CI time
          scripts/green_gate.sh python-only
