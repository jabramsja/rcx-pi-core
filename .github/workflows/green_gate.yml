name: rcx-green-gate

on:
  schedule:
    # Nightly GREEN gate on dev (14:00 UTC ≈ 9:00 AM Detroit)
    - cron: '0 14 * * *'
  workflow_dispatch:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

concurrency:
  group: rcx-green-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  green-gate:
    name: green-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: "0"  # Deterministic dict ordering
      RCX_CI: "1"  # Convert test skips to failures (skip hardening)
      # CI Split: full for nightly (~500 examples), fast for everything else (~50 examples)
      HYPOTHESIS_PROFILE: ${{ github.event_name == 'schedule' && 'ci_full' || 'ci_fast' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Note: Rust setup removed - rcx_pi_rust archived

      - name: Install system deps
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Install project (editable)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -U pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          python -m pip install -e ".[test]"

      - name: Doc consistency check
        shell: bash
        run: |
          set -euo pipefail
          tools/checks/check_docs_consistency.sh

      - name: Enforce tracker sync for core changes
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            if git cat-file -e "$BASE" 2>/dev/null; then
              RANGE="${BASE}...${{ github.sha }}"
              echo "Range: ${BASE}...${{ github.sha }} (PR base)"
            else
              echo "FALLBACK: PR base SHA ($BASE) unreachable, using origin/dev as base"
              git fetch origin dev --quiet
              RANGE="origin/dev...${{ github.sha }}"
              echo "Range: origin/dev...${{ github.sha }}"
            fi
          elif [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              echo "Skipping tracker sync check for new branch push"
              exit 0
            elif git cat-file -e "$BEFORE" 2>/dev/null; then
              RANGE="${BEFORE}...${{ github.sha }}"
              echo "Range: ${BEFORE}...${{ github.sha }} (push)"
            else
              echo "FALLBACK: event.before ($BEFORE) unreachable after force-push, using origin/dev as base"
              git fetch origin dev --quiet
              RANGE="origin/dev...${{ github.sha }}"
              echo "Range: origin/dev...${{ github.sha }}"
            fi
          else
            echo "Skipping tracker sync check for event: ${{ github.event_name }}"
            exit 0
          fi
          tools/checks/enforce_tracker_sync.sh --range "$RANGE"

      - name: Enforce L4 execution contract
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            if git cat-file -e "$BASE" 2>/dev/null; then
              RANGE="${BASE}...${{ github.sha }}"
            else
              git fetch origin dev --quiet
              RANGE="origin/dev...${{ github.sha }}"
            fi
          elif [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              echo "New branch push — using HEAD~1...HEAD as L4 contract range"
              RANGE="HEAD~1...HEAD"
            elif git cat-file -e "$BEFORE" 2>/dev/null; then
              RANGE="${BEFORE}...${{ github.sha }}"
            else
              git fetch origin dev --quiet
              RANGE="origin/dev...${{ github.sha }}"
            fi
          else
            echo "Non-push/PR event (${{ github.event_name }}) — using HEAD~1...HEAD as L4 contract range"
            RANGE="HEAD~1...HEAD"
          fi
          # Derive wave-id from branch name (supports codex/* and jabramsja/*)
          # PR: github.head_ref gives source branch; push: github.ref_name
          if [ -n "${{ github.head_ref }}" ]; then
            BRANCH="${{ github.head_ref }}"
          else
            BRANCH="${{ github.ref_name }}"
          fi
          WAVE_ID_FLAG=""
          WAVE_ID_SUFFIX=""
          if [[ "$BRANCH" == codex/* ]]; then
            WAVE_ID_SUFFIX="${BRANCH#codex/}"
          elif [[ "$BRANCH" == jabramsja/* ]]; then
            WAVE_ID_SUFFIX="${BRANCH#jabramsja/}"
          fi
          # Only set wave-id flag if TASKS.md is in the diff (parity with pre-push-fast)
          if [ -n "$WAVE_ID_SUFFIX" ] && git diff --name-only "$RANGE" 2>/dev/null | grep -qx "TASKS.md"; then
            WAVE_ID_FLAG="--wave-id $WAVE_ID_SUFFIX"
          fi
          python tools/checks/enforce_l4_execution_contract.py --range "$RANGE" $WAVE_ID_FLAG

      - name: Run green gate
        shell: bash
        run: |
          set -euo pipefail
          export PAGER=cat GIT_PAGER=cat LESS='-FRSX'
          # Run python-only mode (Rust substrate archived in Round 24C)
          scripts/green_gate.sh python-only
