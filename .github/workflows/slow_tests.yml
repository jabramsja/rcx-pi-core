name: Slow Tests (Nightly)

on:
  schedule:
    # Nightly at 15:00 UTC (10:00 AM Detroit) — runs after green-gate (14:00 UTC)
    - cron: '0 15 * * *'
  workflow_dispatch:

concurrency:
  group: slow-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  slow-tests:
    name: slow-tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONHASHSEED: "0"
      RCX_CI: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install project
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[test]"

      - name: Run slow tests (meta-circular recurrence, paxos e2e)
        run: |
          set -euo pipefail
          python -m pytest -m "slow and not l4_expensive" -v -n auto --dist worksteal --timeout=300 2>&1
          python -m pytest -m l4_expensive -v -n auto --dist worksteal --timeout=900 2>&1
          echo "✅ Slow tests passed"
