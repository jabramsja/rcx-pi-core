name: Weekly Deep Fuzz (500 examples)

on:
  schedule:
    # Weekly Sunday 06:00 UTC (1:00 AM Detroit) — comprehensive fuzzing
    - cron: '0 6 * * 0'
  workflow_dispatch:

concurrency:
  group: weekly-deep-fuzz-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deep-fuzz:
    name: deep-fuzz-500
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONHASHSEED: "0"
      RCX_CI: "1"
      # 'ci' profile = 500 examples (defined in tests/conftest.py)
      HYPOTHESIS_PROFILE: "ci"

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install project
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[test]"

      - name: Deep fuzz — all hypothesis tests (500 examples)
        run: |
          set -euo pipefail
          echo "HYPOTHESIS_PROFILE=$HYPOTHESIS_PROFILE (500 examples per test)"
          python -m pytest -m fuzzer -v -n auto --dist worksteal --timeout=600 2>&1
          echo "Deep fuzz passed (500 examples)"

      - name: Deep fuzz — stress tests (500 examples)
        run: |
          set -euo pipefail
          python -m pytest tests/stress/ -v -n auto --dist worksteal --timeout=600 2>&1
          echo "Stress tests passed (500 examples)"
