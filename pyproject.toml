[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rcx-pi-core"
version = "0.0.0"
description = "RCX-π core (Python utilities + CLIs)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
rcx-cli = "rcx_pi.rcx_cli:main"

rcx = "rcx_pi.rcx_cli:main"
rcx-program-descriptor = "rcx_pi.program_descriptor_cli:main"
rcx-program-run = "rcx_pi.program_run_cli:main"
rcx-world-trace = "rcx_pi.worlds.world_trace_cli:main"

[tool.setuptools]
packages = ["rcx_pi", "rcx_pi.core", "rcx_pi.engine", "rcx_pi.reduction", "rcx_pi.specs", "rcx_pi.utils", "rcx_pi.worlds"]

[project.optional-dependencies]
test = ["pytest", "pytest-xdist", "pytest-cov", "pytest-timeout", "jsonschema", "hypothesis", "pytest-testmon"]

[tool.pytest.ini_options]
testpaths = ["tests", "rcx_pi"]
pythonpath = ["."]  # Ensure repo root is in sys.path for 'tools' imports
addopts = "--import-mode=importlib"  # Required for tools.* imports to work properly
# Treat DeprecationWarning from rcx_pi as error to catch accidental legacy usage
# Tests that intentionally use deprecated code must wrap with pytest.warns(DeprecationWarning)
filterwarnings = [
    "error::DeprecationWarning:rcx_pi.*",
]
markers = [
    "slow: marks tests as slow (meta-circular recurrence, full paxos e2e). Deselected by default in CI; run with --run-slow or audit_all.sh",
    "fuzzer: marks hypothesis property-based fuzzers. Excluded from green gate; run via audit_all.sh or nightly CI",
]
# NOTE: Parallel execution (-n auto) is NOT enabled by default because:
# - Single-file runs have 3s worker spawn overhead that makes them slower
# - Full suite runs use audit scripts which add -n auto explicitly
# To run full suite with parallel: pytest -n auto --dist worksteal
# Or use: ./tools/audit_fast.sh or ./tools/audit_all.sh

[tool.setuptools.package-data]
"*" = ["*.json", "*.md"]

[tool.setuptools.exclude-package-data]
"*" = ["test_*.py", "**/tests/**"]

# =============================================================================
# Ruff - Fast Python linter and formatter
# =============================================================================
[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Start with essential rules, expand over time
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "W",   # pycodestyle warnings
]
ignore = [
    "E501",  # line too long (handled by formatter, not linter)
    "E731",  # lambda assignment (common in functional code)
]

[tool.ruff.lint.per-file-ignores]
# Tests can have unused imports for fixtures
"tests/**" = ["F401"]
# Prototypes are experimental
"prototypes/**" = ["E", "F", "W"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# =============================================================================
# Mypy - Static type checking (gradual mode)
# =============================================================================
# Gradual typing: don't require annotations on existing code, catch issues in new code
# To run: mypy rcx_pi/ tools/ --ignore-missing-imports
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
# Gradual typing - don't fail on untyped code
ignore_missing_imports = true
check_untyped_defs = false
# Don't require type annotations everywhere yet
disallow_untyped_defs = false

# Strict mode for shared utilities (opt-in)
[[tool.mypy.overrides]]
module = "tools.shared_*"
strict = true
disallow_untyped_defs = true